name: Publish

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag to publish
        required: true
        default: canary
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Check benchmark targets
        run: bun run bench:list

      - name: Prepare canary version
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.npm_tag }}" = "latest" ]; then
            echo "Use a v* tag push for the latest dist-tag."
            exit 1
          fi

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const [major, minor, patch] = pkg.version.split("-")[0].split(".").map(Number);
          const sha = process.env.GITHUB_SHA.slice(0, 7);
          pkg.version = `${major}.${minor}.${patch + 1}-canary.${process.env.GITHUB_RUN_NUMBER}.${sha}`;
          writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          console.log(`${pkg.name}@${pkg.version}`);
          NODE

      - name: Verify release tag
        if: github.event_name == 'push'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const tag = process.env.GITHUB_REF_NAME;
          const expected = `v${pkg.version}`;
          if (tag !== expected) {
            console.error(`Tag ${tag} does not match package version ${expected}`);
            process.exit(1);
          }
          console.log(`${pkg.name}@${pkg.version}`);
          NODE

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Publish canary
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --access public --tag "${{ inputs.npm_tag }}" --provenance

      - name: Publish latest
        if: github.event_name == 'push'
        run: npm publish --access public --tag latest --provenance
